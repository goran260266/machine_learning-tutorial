[project]
name = "machine-learning-tutorial"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "andrejeg1966", email = "goran.andrejevic@web.de" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.5.2",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.8.5",
    "langchain-openrouter>=0.3.0",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]
